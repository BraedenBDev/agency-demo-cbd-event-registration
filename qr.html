<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#0079b8" />
  <title>CBD Registration QR</title>
  <style>
    :root {
      --cbd-blue: #0079b8;
      --cbd-sky: #46b6e4;
      --cbd-deep: #00628f;
      --cbd-green: #bfd730;
      --ink: #07324a;
      --paper: #ffffff;
      --soft: #f4fbfd;
      --muted: #527286;
      --line: rgba(7, 50, 74, 0.18);
      --shadow: rgba(0, 63, 95, 0.18);
    }
    * { box-sizing: border-box; }
    html { color-scheme: light; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(122deg, rgba(191, 215, 48, 0.86) 0 22%, transparent 22.2%),
        linear-gradient(76deg, rgba(70, 182, 228, 0.88) 0 34%, transparent 34.2%),
        linear-gradient(145deg, #029ad0 0%, #0079b8 48%, #66bf71 100%);
      color-scheme: light;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(66deg, transparent 0 35%, rgba(191, 215, 48, 0.4) 35.2% 41%, transparent 41.2%),
        linear-gradient(104deg, transparent 0 47%, rgba(0, 98, 143, 0.35) 47.2% 58%, transparent 58.2%);
      mix-blend-mode: screen;
    }
    .page {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 36px;
      position: relative;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--ink);
      font-size: 12px;
      text-transform: uppercase;
      box-shadow: 0 16px 42px rgba(0, 63, 95, 0.16);
      backdrop-filter: blur(12px);
    }
    .topbar img {
      width: 142px;
      max-width: 48vw;
      height: auto;
      display: block;
    }
    .card {
      margin-top: 28px;
      background: rgba(255, 255, 255, 0.8);
      color: var(--ink);
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 8px;
      padding: 22px;
      box-shadow: 0 24px 70px var(--shadow);
      text-align: center;
      backdrop-filter: blur(12px);
    }
    .sectionLabel {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 46px;
      line-height: 0.95;
      text-transform: uppercase;
      letter-spacing: 0;
    }
    .muted { color: var(--muted); margin-bottom: 16px; }
    .qrIntro { font-size: 14px; line-height: 1.45; }
    #qr {
      background: #fff !important;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      display: inline-block;
      max-width: 100%;
      box-sizing: border-box;
      forced-color-adjust: none;
    }
    #qr canvas, #qr img {
      background: #fff !important;
      filter: none !important;
      forced-color-adjust: none;
      width: 300px;
      max-width: 100%;
      height: auto;
      display: block;
    }
    button {
      margin-top: 14px;
      padding: 12px 16px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid var(--cbd-blue);
      background: var(--cbd-blue);
      color: #ffffff;
      text-transform: uppercase;
      width: 100%;
      font-weight: 700;
    }
    button:hover { background: var(--cbd-deep); }
    .hint { font-size: 13px; color: var(--muted); margin-top: 10px; }
    .btnRow { display: block; width: 100%; }
    .btnGhost { background: #ffffff; color: var(--ink); border-color: var(--line); font-weight: 400; }
    .btnGhost:hover { background: #eefafd; color: var(--ink); border-color: var(--cbd-blue); }
    @media (max-width: 520px) {
      .page { width: min(100% - 24px, 760px); padding: 14px 0 24px; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .topbar img { width: 128px; }
      .sectionLabel { flex-direction: column; }
      h1 { font-size: 34px; }
      .card { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <img src="cbd-logo.svg" alt="Commercial Bank of Dubai" />
      <span>Dubai, UAE</span>
    </header>
    <div class="card">
      <div class="sectionLabel">
        <span>Registration QR</span>
        <span>Secure check-in</span>
      </div>
      <h1>QR code generated</h1>
      <div class="muted qrIntro">Screenshot or download this QR code, then proceed to the registration counter.</div>
      <div id="qr"></div>
      <div class="btnRow">
        <button id="downloadBtn" type="button">Download QR PNG</button>
        <button id="backBtn" type="button" class="btnGhost">Back to Registration</button>
      </div>
      <div class="hint" id="msg"></div>
    </div>
  </div>

  <script src="libs/qrcode.min.js"></script>
  <script src="qr.js"></script>
</body>
</html>
